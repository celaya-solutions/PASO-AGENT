name: macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate for macOS release handoff (for example v2026.3.22, v2026.3.22-alpha.1, or v2026.3.22-beta.1)
        required: true
        type: string
      preflight_only:
        description: Retained for operator compatibility; this public workflow is validation-only
        required: true
        default: true
        type: boolean
      public_release_branch:
        description: Public branch that contains the release tag commit, usually main or release/YYYY.M.PATCH
        required: false
        default: main
        type: string

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.19.0"

jobs:
  validate_macos_release_request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-(alpha|beta)\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            echo "Invalid release tag format: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Prepare Git owner
        uses: ./.github/actions/git-owner

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"
          build-all-cache-scope: full

      - name: Build
        run: pnpm build

      - name: Build Control UI
        env:
          OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"
        run: pnpm ui:build

      - name: Validate release tag and package metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLIC_RELEASE_BRANCH: ${{ inputs.public_release_branch }}
        run: |
          set -euo pipefail
          if [[ "${PUBLIC_RELEASE_BRANCH}" != "main" && ! "${PUBLIC_RELEASE_BRANCH}" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "public_release_branch must be main or release/YYYY.M.PATCH, got ${PUBLIC_RELEASE_BRANCH}." >&2
            exit 1
          fi
          RELEASE_SHA="$(
            python3 -I -S "$CI_GIT_OWNER" --git 0 rev-parse HEAD
          )"
          RELEASE_MAIN_REF="refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          export RELEASE_SHA RELEASE_TAG RELEASE_MAIN_REF
          python3 -I -S "$CI_GIT_OWNER" --checkout-git 120 fetch --no-tags origin \
            "+refs/heads/${PUBLIC_RELEASE_BRANCH}:refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          pnpm release:openclaw:npm:check

      - name: Summarize next step
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "## Public macOS validation only"
            echo
            echo "This workflow validates the public release handoff and still builds JS artifacts needed for release checks."
            echo "It does not sign, notarize, or upload macOS assets."
            echo
            echo "PASO macOS publishing remains disabled until Celaya Solutions Research configures its own Apple signing identity, notarization credentials, Sparkle key, and private release workflow."
            echo "Do not use the inherited upstream OpenClaw signing workflow or key for a PASO release."
            echo "The checked-in appcast stays explicitly disabled until a fork-owned signed build exists."
          } >> "$GITHUB_STEP_SUMMARY"
