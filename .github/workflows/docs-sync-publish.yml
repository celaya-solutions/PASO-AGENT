name: Docs Sync Publish Repo

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - scripts/docs-list.js
      - scripts/docs-sync-publish.mjs
      - scripts/check-docs-mdx.mjs
      - scripts/check-docs-mdx.mts
      - scripts/lib/arg-utils.runtime.mjs
      - scripts/lib/mintlify-accordion.mjs
      - scripts/lib/tsx-cli-shim.mjs
      - scripts/lib/local-check-runtime.mts
      - .github/workflows/docs-sync-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # cancel-in-progress starved the mirror: every main push cancelled the in-flight
  # sync and cancelled runs leave no successor, so under sustained merge velocity
  # the configured PASO docs repo never advanced. Queue instead — GitHub keeps only the newest
  # pending run per group, and skip_stale_source keeps completed runs idempotent.
  group: docs-sync-publish-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: false

jobs:
  sync-publish-repo:
    runs-on: ubuntu-latest
    env:
      PASO_CLAWHUB_SOURCE_REPOSITORY: ${{ vars.PASO_CLAWHUB_SOURCE_REPOSITORY }}
      PASO_DOCS_PUBLISH_REPOSITORY: ${{ vars.PASO_DOCS_PUBLISH_REPOSITORY }}
      PASO_DOCS_SYNC_TOKEN: ${{ secrets.PASO_DOCS_SYNC_TOKEN }}
    steps:
      - name: Resolve PASO docs sync targets
        id: target
        run: |
          set -euo pipefail
          if [[ -z "${PASO_DOCS_PUBLISH_REPOSITORY// }" && -z "${PASO_CLAWHUB_SOURCE_REPOSITORY// }" && -z "${PASO_DOCS_SYNC_TOKEN// }" ]]; then
            echo "PASO docs sync is disabled. Configure PASO_DOCS_PUBLISH_REPOSITORY, PASO_CLAWHUB_SOURCE_REPOSITORY, and PASO_DOCS_SYNC_TOKEN to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${PASO_DOCS_PUBLISH_REPOSITORY// }" || -z "${PASO_CLAWHUB_SOURCE_REPOSITORY// }" || -z "${PASO_DOCS_SYNC_TOKEN// }" ]]; then
            echo "::error::PASO docs sync repository variables and token must be configured together."
            exit 1
          fi
          for repository in "$PASO_DOCS_PUBLISH_REPOSITORY" "$PASO_CLAWHUB_SOURCE_REPOSITORY"; do
            if [[ ! "$repository" =~ ^celaya-solutions/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::PASO docs sync targets must be Celaya Solutions repositories."
              exit 1
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout source repo
        if: steps.target.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout configured plugin docs source
        if: steps.target.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.PASO_CLAWHUB_SOURCE_REPOSITORY }}
          ref: main
          path: clawhub-source
          fetch-depth: 1
          persist-credentials: false
          token: ${{ env.PASO_DOCS_SYNC_TOKEN }}

      - name: Prepare Git owner
        if: steps.target.outputs.enabled == 'true'
        uses: celaya-solutions/PASO-AGENT/.github/actions/git-owner@dd4528b6393e7d00063067a080ca7241b48ce475

      - name: Setup Node
        if: steps.target.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Clone publish repo
        if: steps.target.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy - <<'PYTHON'
          import os
          import subprocess
          import sys
          from ci_git_owner import run_git, GitFailure, FetchTimeout, backoff, check_cancelled

          workspace = os.environ["GITHUB_WORKSPACE"]
          publish = os.path.join(workspace, "publish")
          for attempt in range(1, 6):
              check_cancelled()
              # Delete only this fixed entry, including a file or symlink, after
              # the previous Git tree has been verified extinct.
              subprocess.run(["rm", "-rf", publish], check=True)
              try:
                  run_git(workspace, "clone",
                          f"https://x-access-token:{os.environ['PASO_DOCS_SYNC_TOKEN']}@github.com/{os.environ['PASO_DOCS_PUBLISH_REPOSITORY']}.git",
                          publish, timeout=120)
                  raise SystemExit(0)
              except (GitFailure, FetchTimeout):
                  print(f"Clone attempt {attempt} failed; retrying.", flush=True)
                  backoff(attempt * 2)
          print("Failed to clone publish repo after retries.", file=sys.stderr)
          raise SystemExit(1)
          PYTHON

      - name: Sync docs into publish repo
        if: steps.target.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          clawhub_sha="$(cd "$GITHUB_WORKSPACE/clawhub-source" && python3 -I -S "$CI_GIT_OWNER" --checkout-git 0 rev-parse HEAD)"
          node scripts/docs-sync-publish.mjs \
            --target "$GITHUB_WORKSPACE/publish" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --clawhub-repo "$GITHUB_WORKSPACE/clawhub-source" \
            --clawhub-source-repo "$PASO_CLAWHUB_SOURCE_REPOSITORY" \
            --clawhub-source-sha "$clawhub_sha"

      - name: Install docs MDX checker dependency
        if: steps.target.outputs.enabled == 'true'
        working-directory: publish
        run: npm install --no-save --package-lock=false @mdx-js/mdx@3.1.1 tsx@4.23.12

      - name: Check publish docs MDX
        if: steps.target.outputs.enabled == 'true'
        run: node "$GITHUB_WORKSPACE/publish/.openclaw-sync/check-docs-mdx.mjs" "$GITHUB_WORKSPACE/publish/docs"

      - name: Commit publish repo sync
        if: steps.target.outputs.enabled == 'true'
        working-directory: publish
        run: |
          set -euo pipefail
          exec python3 -I -S "$CI_GIT_OWNER" --policy - <<'PYTHON'
          import json
          import os
          import subprocess
          import tempfile
          from ci_git_owner import run_git, GitFailure, FetchTimeout, backoff

          publish = os.getcwd()
          workspace = os.environ["GITHUB_WORKSPACE"]
          source_sha = os.environ["GITHUB_SHA"]

          def invalid_json_constant(value):
              raise json.JSONDecodeError("Invalid JSON constant", value, 0)

          def remote_source_sha():
              try:
                  with tempfile.TemporaryFile() as output:
                      run_git(publish, "show", "refs/remotes/origin/main:.openclaw-sync/source.json",
                              stdout=output, stderr=subprocess.DEVNULL)
                      output.seek(0)
                      data = json.loads(output.read().decode("utf-8", errors="replace"),
                                        parse_constant=invalid_json_constant)
                  sha = data.get("sha") if isinstance(data, dict) else None
                  return sha.rstrip("\n") if isinstance(sha, str) else ""
              except (GitFailure, json.JSONDecodeError):
                  return ""

          def skip_stale_source():
              current_source_sha = remote_source_sha()
              if not current_source_sha or current_source_sha == source_sha:
                  return
              try:
                  run_git(workspace, "merge-base", "--is-ancestor", source_sha, current_source_sha)
              except GitFailure:
                  return
              print(f"Skipping stale publish sync for {source_sha}; origin/main already mirrors {current_source_sha}.")
              raise SystemExit(0)

          try:
              run_git(publish, "diff", "--quiet", "--", "docs", ".openclaw-sync")
          except GitFailure:
              pass
          else:
              print("No publish-repo changes.")
              raise SystemExit(0)

          try:
              run_git(publish, "fetch", "origin", "main:refs/remotes/origin/main", timeout=120, reclaim_locks=True)
          except (GitFailure, FetchTimeout):
              pass
          else:
              skip_stale_source()

          run_git(publish, "config", "user.name", "paso-docs-sync[bot]", reclaim_locks=True)
          run_git(publish, "config", "user.email", "paso-docs-sync[bot]@users.noreply.github.com", reclaim_locks=True)
          run_git(publish, "add", "docs", ".openclaw-sync", reclaim_locks=True)
          run_git(publish, "commit", "-m", f"chore(sync): mirror docs from {os.environ['GITHUB_REPOSITORY']}@{source_sha}", reclaim_locks=True)
          for attempt in range(1, 6):
              try:
                  run_git(publish, "fetch", "origin", "main:refs/remotes/origin/main", timeout=120, reclaim_locks=True)
                  skip_stale_source()
                  run_git(publish, "rebase", "-X", "theirs", "origin/main", reclaim_locks=True)
                  run_git(publish, "push", "origin", "HEAD:main", reclaim_locks=True)
                  raise SystemExit(0)
              except (GitFailure, FetchTimeout):
                  # Only verified Git failure may reach abort/retry; ownership
                  # uncertainty and cancellation escape the connected policy.
                  try:
                      run_git(publish, "rebase", "--abort", stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL, reclaim_locks=True)
                  except GitFailure:
                      pass
                  print(f"Publish sync attempt {attempt} failed; retrying.", flush=True)
                  backoff(attempt * 2)
          print("Failed to push publish-repo sync after retries.")
          raise SystemExit(1)
          PYTHON
